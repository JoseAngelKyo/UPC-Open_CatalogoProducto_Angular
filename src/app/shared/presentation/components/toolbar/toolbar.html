<mat-toolbar class="app-toolbar">
  <div class="toolbar-brand">
    <img
      src="https://img.logo.dev/dummyjson.com?token=pk_H-D5rqJGRtCnUq76HmOlCg&format=webp&retina=true"
      alt="DummyJSON logo"
    >

    <span class="toolbar-title">
      {{ 'TOOLBAR.TITLE'| translate }}
    </span>
  </div>

  <span class="toolbar-spacer"></span>

  <mat-button-toggle-group
    [value]="currentLanguage"
    (change)="onLanguageChange($event.value)"
    class="lang-toggle"
  >
    <mat-button-toggle value="en">EN</mat-button-toggle>
    <mat-button-toggle value="es">ES</mat-button-toggle>
  </mat-button-toggle-group>
</mat-toolbar>
